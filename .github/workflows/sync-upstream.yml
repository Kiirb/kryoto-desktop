name: Sync upstream

# Fork only (Kiirb/kryoto-desktop). Every hour: when Kryoto-Dev/kryoto-desktop
# has published a release whose tag is not merged into `kiirb` yet, merge that
# tag into `kiirb` and push. The merge bumps the version in
# src-tauri/tauri.conf.json, so the push starts release.yml (and ci.yml), which
# builds, signs with the fork's updater key and publishes the same version here.
#
# The push uses the SYNC_TOKEN secret, a fine-grained token for this repository
# with Contents and Workflows read/write. GITHUB_TOKEN cannot do it: its pushes
# start no other workflow, and it may not push upstream's changes to
# .github/workflows.
#
# A merge conflict stops the sync and opens an issue; resolve it locally
# (git fetch origin --no-tags, merge the tag into kiirb, push) and the
# release follows from that push.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: Kryoto-Dev/kryoto-desktop
  BRANCH: kiirb

jobs:
  sync:
    if: github.repository == 'Kiirb/kryoto-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the sync token
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set. Create a fine-grained token for this repository with Contents and Workflows read/write and save it as the SYNC_TOKEN secret."
            exit 1
          fi

      - name: Upstream's latest release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Upstream's latest release has an unexpected tag: '$tag'"
            exit 1
          fi
          echo "Upstream latest: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge it into ${{ env.BRANCH }}
        id: merge
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          # Kept out of refs/tags: release.yml decides from this repository's
          # own tags whether a version is released yet.
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "+refs/tags/$TAG:refs/upstream/$TAG"
          if git merge-base --is-ancestor "refs/upstream/$TAG" HEAD; then
            echo "$TAG is already in $BRANCH; nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Kirb"
          git config user.email "60970843+Kiirb@users.noreply.github.com"
          if ! git merge --no-ff --no-edit -m "Merge upstream $TAG" "refs/upstream/$TAG"; then
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "::error::Merging upstream $TAG conflicts in: $(tr '\n' ' ' < conflicts.txt)"
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Merged and pushed upstream $TAG; release.yml takes it from here."

      - name: Open an issue about the conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          title="Upstream $TAG does not merge cleanly"
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "An issue is already open."
            exit 0
          fi
          {
            echo "The hourly sync could not merge upstream \`$TAG\` into \`$BRANCH\`."
            echo
            echo "Conflicting files:"
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Resolve locally:"
            echo '```'
            echo "git fetch --no-tags origin refs/tags/$TAG:refs/upstream/$TAG"
            echo "git switch $BRANCH && git merge refs/upstream/$TAG"
            echo "# fix, commit, then: git push kiirb $BRANCH"
            echo '```'
          } > body.md
          gh issue create --title "$title" --body-file body.md
